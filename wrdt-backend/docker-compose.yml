# LOCAL DEVELOPMENT ONLY (throwaway database, hot reload). Not for production.
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["./app:/code/app"]
    depends_on: [db]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devonly-change-me
      POSTGRES_DB: wrdt_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: [wrdt_pgdata:/var/lib/postgresql/data]
volumes:
  wrdt_pgdata:
